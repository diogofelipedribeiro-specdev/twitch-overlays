<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transição · ninja praiano</title>
  <!--
    TRANSIÇÃO ENTRE CENAS (overlay)
    Browser Source 1920 × 1080, fundo transparente.
    Uma onda diagonal nas cores da identidade varre a tela, o mascote aparece
    no centro e tudo sai pelo outro lado. Duração padrão: 1,6 s.

    Como usar no OBS:
      1. Adicione esta página como fonte de navegador em CADA cena (copie a
         fonte e cole como "referência" para reaproveitar).
      2. Nas propriedades da fonte, marque "Atualizar navegador quando a cena
         ficar ativa". Assim a animação toca toda vez que a cena entra.
      3. Deixe a fonte no TOPO da lista de fontes da cena.
      Também reage ao evento obsSceneChanged do OBS (fonte compartilhada).

    Parâmetros:
      ?dur=1600        duração total em ms
      ?texto=Gameplay  rótulo mostrado embaixo do mascote (opcional)
      ?dir=rl          sentido: lr (esquerda→direita, padrão) ou rl
      ?loop=1          repete a cada 3 s (para pré-visualizar)
      ?emote=hype      cabeça usada: to-de-boa (padrão), hype, risada, gg, em-extase
      ?full=1          usa o mascote de corpo inteiro em vez da cabeça
  -->
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tr" id="tr">
    <!-- ondas diagonais (a de trás é mais clara) -->
    <div class="tr-wave tr-wave--b"></div>
    <div class="tr-wave tr-wave--a">
      <div class="tr-foam"></div>
    </div>

    <!-- mascote no centro -->
    <div class="tr-center">
      <svg class="tr-mascot" id="mascot" viewBox="100 34 200 200"><use id="mascotUse" href="#emote-to-de-boa"/></svg>
      <div class="tr-label brand" id="label"></div>
    </div>
  </div>

  <script src="../shared/config.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="../shared/sprites.js"></script>
  <script src="script.js"></script>
</body>
</html>
