<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transição · ninja praiano</title>
  <!--
    TRANSIÇÃO ENTRE CENAS (overlay)
    Browser Source 1920 × 1080, fundo transparente.
    MODO PADRÃO ("revelar"): a página já nasce coberta pela onda e pelo mascote;
    quando a cena entra no OBS, a onda sai e REVELA a cena nova. Isso esconde
    a troca de cena (uma fonte só existe na cena de destino, então a metade
    "entrada" de uma animação nunca conseguiria cobrir a troca).
    ?mode=full toca entrada + saída (bom para pré-visualizar).

    Como usar no OBS:
      1. Adicione esta página como fonte de navegador em CADA cena (copie a
         fonte e cole como "referência" para reaproveitar) e deixe-a no TOPO.
      2. Deixe DESMARCADAS "desligar a fonte quando não estiver visível" e
         "atualizar o navegador quando a cena se tornar ativa": a página fica
         carregada e toca na hora pelo evento de visibilidade do OBS, sem o
         atraso de recarregar.
      3. Em "Transições de cena" use "Cortar" (0 ms).

    Parâmetros:
      ?mode=full       entrada + saída (padrão: reveal = só a saída)
      ?dur=1400        duração total em ms (padrão: 1400 no reveal, 1600 no full)
      ?texto=Gameplay  rótulo mostrado embaixo do mascote (opcional)
      ?dir=rl          sentido: lr (esquerda→direita, padrão) ou rl
      ?loop=1          repete a cada 3 s (para pré-visualizar)
      ?emote=hype      cabeça usada: to-de-boa (padrão), hype, risada, gg, em-extase
      ?full=1          usa o mascote de corpo inteiro em vez da cabeça
  -->
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- "covered" no HTML: a tela já começa coberta antes de qualquer script rodar -->
  <div class="tr covered" id="tr">
    <!-- ondas diagonais (a de trás é mais clara) -->
    <div class="tr-wave tr-wave--b"></div>
    <div class="tr-wave tr-wave--a">
      <div class="tr-foam"></div>
    </div>

    <!-- mascote no centro -->
    <div class="tr-center">
      <svg class="tr-mascot" id="mascot" viewBox="100 34 200 200"><use id="mascotUse" href="#emote-to-de-boa"/></svg>
      <div class="tr-label brand" id="label"></div>
    </div>
  </div>

  <script src="../shared/config.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="../shared/sprites.js"></script>
  <script src="script.js"></script>
</body>
</html>
